<style>
/* Concept: a cozy pixel-game title screen. Daytime meadow behind, parchment panels and floating menu tabs in front.
   One committed look (single theme): sky, parchment, wood. Dani is coral, Rin is sky blue. Colour always means "who". */
:root{
  --ink:#5B3A29; --text:#4A3426; --muted:#7A5A43;
  --paper:#FFF4DA; --paper-hi:#FFFBEF; --paper-lo:#EAD3A2; --shadow:rgba(91,58,41,.30);
  --coral:#F4978E; --sky:#8EC9F0; --gold:#F6C453; --leaf:#7BC67B; --sky-bg:#BFE3F7;
  --font:'Pixelify Sans','Courier New',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sky-bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky-bg);z-index:10}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;padding:0}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.spr{display:block;image-rendering:pixelated;flex:none}

/* ---------- the little world behind everything ---------- */
.world{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(var(--sky-bg) 0,var(--sky-bg) 90px,var(--sky-2) 42%,var(--sky-3) 100%)}
.cloud{position:absolute;left:0;animation:drift linear infinite;opacity:.95}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}}
.grass{position:absolute;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom,0px));image-rendering:pixelated}
.grass-body{position:absolute;left:0;right:0;bottom:0;top:22px;background:
  repeating-linear-gradient(90deg,transparent 0 28px,rgba(0,0,0,.10) 28px 36px),var(--gA)}
.grass-top{position:absolute;left:0;right:0;top:0;height:24px;background-repeat:repeat-x;background-size:64px 24px;image-rendering:pixelated}

/* ---------- pixel panel: notched corners, hand-made edge, hard shadow ---------- */
.px{--t:4px;--edge:var(--ink);--fill:var(--paper);--hi:var(--paper-hi);--lo:var(--paper-lo);
  margin:var(--t);background:var(--fill);
  box-shadow:0 calc(-1*var(--t)) 0 0 var(--edge),0 var(--t) 0 0 var(--edge),calc(-1*var(--t)) 0 0 0 var(--edge),var(--t) 0 0 0 var(--edge),
    inset var(--t) var(--t) 0 0 var(--hi),inset calc(-1*var(--t)) calc(-1*var(--t)) 0 0 var(--lo);
  filter:drop-shadow(0 6px 0 var(--shadow))}
.px.s{--t:3px}
.c-coral{--fill:#F4978E;--hi:#FFB9B1;--lo:#DE7B72}
.c-sky{--fill:#8EC9F0;--hi:#B6DFF7;--lo:#6FB0DD}
.c-gold{--fill:#F6C453;--hi:#FFDD88;--lo:#DDA52F}
.c-leaf{--fill:#7BC67B;--hi:#A2DBA2;--lo:#5BAE5E}
.c-wood{--fill:#B07A4F;--hi:#CB966A;--lo:#8F5F3B}
.c-white{--fill:#FFFDF5;--hi:#FFFFFF;--lo:#EFE3C6}

.app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh}

/* sign */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sky-bg);padding:10px 0 12px}
.sign{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px}
.sign h1{margin:0;font-size:22px;line-height:1;font-weight:700;color:#FFF4DA;text-shadow:2px 2px 0 var(--ink)}
.sign .sub{display:flex;align-items:center;gap:6px;font-size:13px;color:#FFE9BF;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 6px;font-size:14px;font-weight:500}
.who:active{transform:translateY(3px)}

main{position:relative;padding-bottom:112px;display:flex;flex-direction:column;gap:10px}
.card{padding:12px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
h2{font-size:22px;margin:0;font-weight:700;line-height:1.15}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}

/* buttons */
.btn{min-height:38px;padding:0 12px;font-weight:700;font-size:15px;transition:transform .08s}
.btn:active{transform:translateY(3px);filter:drop-shadow(0 2px 0 var(--shadow))}
@media (hover:hover){.btn:hover{--edge:#3E2619;transform:translateY(-2px)}}
.btn.me-a{--fill:#F4978E;--hi:#FFB9B1;--lo:#DE7B72}
.btn.me-b{--fill:#8EC9F0;--hi:#B6DFF7;--lo:#6FB0DD}

/* motion */
.chr{transform-origin:50% 100%;overflow:visible}
.blink{opacity:0;animation:blink 4.6s infinite}
.scene .pa .chr{animation:hop 3.6s ease-in-out infinite}
.scene .pb .chr{animation:sway2 3s ease-in-out infinite;animation-delay:-1s}
.pet{background:none;border:0;padding:0;line-height:0;cursor:pointer}
.pet.pop .chr{animation:pop .5s ease-out 1!important}
.shp .chr,.turn .chr{animation:sway2 2.8s ease-in-out infinite}
.cl2{position:absolute;top:28px;right:-30px;opacity:.85;animation:drift 22s linear infinite}
.scene .cl{animation:drift 30s linear infinite;animation-delay:-12s;left:-40px}
.bfly{position:absolute;top:60px;left:-20px;animation:fly 11s linear infinite;line-height:0}
.bfly svg{animation:flap .35s steps(2,jump-none) infinite;transform-origin:50% 50%}
.bfly.b2{top:84px;animation-duration:15s;animation-delay:-6s;animation-direction:reverse}
.spk{position:absolute;width:6px;height:6px;background:#FFF6C8;box-shadow:0 0 0 2px #FFF6C8;animation:twinkle 2.2s steps(2,jump-none) infinite}
.spk:before,.spk:after{content:"";position:absolute;background:#FFF6C8}
.spk:before{left:-6px;top:0;width:18px;height:6px}.spk:after{top:-6px;left:0;width:6px;height:18px}
.spk.s1{left:18%;top:30px}.spk.s2{left:70%;top:18px;animation-delay:-.7s;transform:scale(.7)}.spk.s3{left:42%;top:12px;animation-delay:-1.4s;transform:scale(.6)}.spk.s4{left:88%;top:70px;animation-delay:-.3s;transform:scale(.6)}
.rise{position:absolute;bottom:40px;left:50%;opacity:0;animation:rise 4.5s ease-out infinite;line-height:0}
.rise.r2{animation-delay:-1.5s;margin-left:-26px}.rise.r3{animation-delay:-3s;margin-left:24px}
.sway{transform-origin:50% 100%;animation:swayf 3s ease-in-out infinite}.sway.d2{animation-delay:-1s}.sway.d3{animation-delay:-2s}
.spin svg{animation:spinc 2.4s steps(6,jump-none) infinite}
.floath{position:absolute;pointer-events:none;line-height:0;animation:rise2 1.1s ease-out forwards;z-index:3}
@keyframes hop{0%,62%,100%{transform:translateY(0) scale(1,1)}68%{transform:translateY(0) scale(1.06,.92)}76%{transform:translateY(-14px) scale(.96,1.06)}86%{transform:translateY(0) scale(1.06,.92)}92%{transform:translateY(-5px)}96%{transform:translateY(0)}}
@keyframes sway2{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-2px)}}
@keyframes pop{0%{transform:scale(1,1)}30%{transform:translateY(-18px) scale(.94,1.1)}60%{transform:translateY(0) scale(1.1,.88)}100%{transform:scale(1,1)}}
@keyframes blink{0%,91%,100%{opacity:0}93%,97%{opacity:1}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(480px)}}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(110px,-18px)}50%{transform:translate(220px,6px)}75%{transform:translate(330px,-14px)}100%{transform:translate(440px,0)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes rise2{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}
@keyframes swayf{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes spinc{from{transform:scaleX(1)}50%{transform:scaleX(.15)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.chr,.blink,.cl,.cl2,.bfly,.bfly svg,.spk,.rise,.sway,.spin svg{animation:none!important}}
/* home scene */
.scene{position:relative;height:124px;--fill:var(--sc-fill,#CDE9F9);--hi:var(--sc-hi,#E2F4FD);--lo:var(--sc-lo,#B5DAF0);overflow:hidden;display:flex;justify-content:center;align-items:flex-end;gap:26px;padding-bottom:12px}
.scene .gr{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--gA,#7BC67B);border-top:4px solid var(--gB,#5BAE5E)}
.scene .heartbob{position:absolute;left:50%;top:14px;margin-left:-18px;animation:bob 1.6s steps(2,jump-none) infinite}
.scene .chars{position:relative;display:flex;gap:30px;align-items:flex-end;margin-bottom:10px}
.scene .fl{position:absolute;bottom:4px}
.scene .cl{position:absolute;top:10px;left:14px;opacity:.9}
.big{font-size:54px;line-height:1;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--text);text-shadow:3px 3px 0 #F6C453}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* moods */
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mtag{display:inline-block;padding:5px 12px;font-weight:700;margin-top:6px;--t:3px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chip{min-height:40px;padding:0 12px;font-size:15px}
.chip.on.a{--fill:#F4978E;--hi:#FFB9B1;--lo:#DE7B72}
.chip.on.b{--fill:#8EC9F0;--hi:#B6DFF7;--lo:#6FB0DD}
.chip.on{--edge:#3E2619}

/* events */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px;padding:8px 0 6px;font-size:12px;color:var(--muted);transition:transform .08s}
.dbtn b{font-size:20px;color:var(--text);font-variant-numeric:tabular-nums}
.dbtn.on{--fill:#F6C453;--hi:#FFDD88;--lo:#DDA52F;--edge:#3E2619;color:var(--text);transform:translateY(-3px)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;display:inline-block}
.dot.a,.mk.a{background:#F4978E}.dot.b,.mk.b{background:#8EC9F0}
.dot.both,.mk.both{background:linear-gradient(90deg,#F4978E 50%,#8EC9F0 50%)}
.evs{display:flex;flex-direction:column;gap:16px}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .time{width:50px;font-variant-numeric:tabular-nums;color:var(--muted);flex:none;padding-top:1px}
.mk{width:14px;height:14px;flex:none;margin:6px 4px 0;box-shadow:0 0 0 3px var(--ink)}
.ev .t{font-weight:700} .ev .w{font-size:14px;color:var(--muted)}

/* forms */
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pxin{min-height:46px;padding:0 12px;min-width:0;font-size:16px;--fill:#FFFDF5;--hi:#EFE3C6;--lo:#FFFFFF;--t:3px;border:0;border-radius:0;outline-offset:3px}
.form input[type=text]{flex:1 1 150px}
.form input[type=time]{flex:0 0 112px}

/* header buttons, search, settings, themes */
.hbs{display:flex;align-items:center;gap:2px;flex:none}
.hb{min-width:40px;min-height:40px;display:grid;place-items:center;padding:0}
.hb:active,.who:active{transform:translateY(3px)}
.who .nm{display:none}
@media (min-width:440px){.who .nm{display:inline}}
@media (max-width:400px){.sign h1{font-size:22px}#signflower{display:none}}
mark{background:#F6C453;color:var(--text);padding:0 2px}
.res{display:flex;gap:12px;align-items:center;width:100%;min-height:46px;text-align:left;background:none;border-top:3px dotted var(--paper-lo);padding:4px 0}
.res:first-child{border-top:0}
.looks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.looks .look:last-child:nth-child(odd){grid-column:1/-1}
.look{display:flex;flex-direction:column;gap:8px;padding:8px;text-align:left;font-size:15px;font-weight:500}
.look.on{--fill:#FFE9A8;--hi:#FFF3CC;--lo:#F6C453;--edge:#3E2619;font-weight:700}
.look .sw2{display:block;height:44px;box-shadow:0 0 0 2px var(--ink)}
#clouds{position:absolute;inset:0;filter:var(--cloud-filter,none);opacity:var(--cloud-op,1)}
#fx{position:absolute;inset:0;overflow:hidden}
#fx i{position:absolute;display:block}
.rain i{top:-24px;width:3px;height:14px;background:rgba(255,255,255,.7);animation:fall linear infinite}
.leafs i{top:-16px;width:10px;height:10px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.15);animation:sway linear infinite}
.stars i{width:4px;height:4px;background:#FFF4DA;animation:tw 2.4s steps(2,jump-none) infinite}
.spark i{top:-10px;width:5px;height:5px;opacity:.9;animation:fall linear infinite}
.lights i{width:10px;height:14px;box-shadow:0 0 0 2px #3E2619;animation:tw 1.6s steps(2,jump-none) infinite}
.wire{position:absolute;left:0;right:0;top:108px;height:3px;background:#3E2619}
@keyframes fall{to{transform:translateY(110vh)}}
@keyframes sway{0%{transform:translate(0,0)}50%{transform:translate(28px,55vh)}100%{transform:translate(-10px,110vh)}}
@keyframes tw{50%{opacity:.3}}

/* home overview */
.chars svg{animation:hop 2.6s steps(2,jump-none) infinite}
.chars svg:nth-child(2){animation-delay:-1.3s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 8px;font-size:15px}
.minip .photo{margin-left:0;margin-right:0}
.minip .ph>*{aspect-ratio:16/9}

/* memory replies */
.reps{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:12px;border-top:3px dotted var(--paper-lo)}
.rep{display:flex;gap:8px;align-items:flex-end}
.rb{padding:8px 12px;overflow-wrap:anywhere;--t:3px}
.rav{flex:none;line-height:0}
.repform{margin-top:12px}
.rdl{min-height:36px;padding:0 4px;font-size:13px}

/* games */
.suc{position:relative;min-width:0;padding:0;border:0;border-right:1px solid #D9C8A0;border-bottom:1px solid #D9C8A0;background:#FFFDF5;display:grid;place-items:center;font-size:clamp(16px,6vw,24px);font-weight:700;color:var(--ink);line-height:1}
.sugrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));border:3px solid var(--ink);background:#FFFDF5;width:min(100%,calc(100vh - 470px));aspect-ratio:1;margin:4px auto 0}
.suc.br{border-right:3px solid var(--ink)}.suc.bb{border-bottom:3px solid var(--ink)}
.suc.peer{background:#F8EBC9}.suc.same{background:#FFD98A}.suc.sel{background:#FFE08A;box-shadow:inset 0 0 0 3px #F4978E}.suc.bad{background:#F8B4AE}
.suc .d.wa{color:#D14B42}.suc .d.wb{color:#2F7CB5}.suc .d.wh{color:#A87A00}.suc .d.g{color:var(--ink)}
.suc .d.cf{text-decoration:underline wavy #C0392B;text-underline-offset:3px}
.nt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(7px,2.4vw,10px);font-weight:500;color:var(--muted)}
.nt i{display:grid;place-items:center;font-style:normal}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px}
.pbn{min-height:44px;padding:0;margin:2px;background:var(--paper);color:var(--ink);box-shadow:0 0 0 2px var(--ink),inset -2px -2px 0 var(--paper-lo);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700;line-height:1}
.pbn small{font-size:10px;font-weight:500;color:var(--muted);margin-top:3px}
.pbn:active{transform:translateY(2px)}.pbn[disabled]{opacity:.4}
.qa4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa4 .btn{padding:0 4px;font-size:15px;min-width:0}
.btn[disabled]{opacity:.45;cursor:default}
.solved{padding:12px;margin:12px 4px 4px;text-align:center}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend2 span{display:flex;align-items:center;gap:6px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbox{display:flex;align-items:center;gap:8px;padding:8px;min-width:0}
.pts{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sbwrap{overflow:auto;border:3px solid var(--ink);background:#7A5A43;max-width:100%}
.sbgrid{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:1px;width:100%}
.sbgrid.z{width:640px}
.sc{aspect-ratio:1;min-width:0;padding:0;border:0;display:grid;place-items:center;font-size:clamp(7px,2.3vw,10px);font-weight:700;color:#7A5A43;background:#EBDDB8;line-height:1;position:relative}
.sc .pl{font-size:inherit}
.sc.prem-TW{background:#F4978E;color:#fff}.sc.prem-DW,.sc.prem-ST{background:#FFC2D1}.sc.prem-TL{background:#8EC9F0}.sc.prem-DL{background:#CDE9F9}
.sc.t{background:#FFF4DA;color:#3E2619;box-shadow:inset 0 -2px 0 #D9C8A0;font-size:clamp(12px,4vw,17px)}
.sc.t small{position:absolute;right:1px;bottom:0;font-size:6px;font-weight:500}
.sc.pend{background:#FFE08A;box-shadow:inset 0 0 0 2px #F4978E}
.sc.blankt{color:#B07A4F}
.sbgrid.z .sc{font-size:13px}.sbgrid.z .sc.t{font-size:24px}.sbgrid.z .sc.t small{font-size:10px;right:3px;bottom:2px}
.rack{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.rt{position:relative;width:42px;height:52px;padding:0;background:#FFF4DA;color:#3E2619;font-size:26px;font-weight:700;box-shadow:0 0 0 2px var(--ink),inset 0 -4px 0 #D9C8A0;display:grid;place-items:center;margin:2px}
.rt small{position:absolute;right:3px;bottom:5px;font-size:10px;font-weight:500}
.rt.sel{transform:translateY(-6px);background:#FFE08A;box-shadow:0 0 0 2px var(--ink),0 0 0 5px #F4978E}
.rt.sw{background:#CDE9F9;transform:translateY(-4px)}
.preview{min-height:24px;text-align:center;margin-bottom:10px}

/* shop */
.seg4m{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px!important}
.seg4m button{font-size:12px!important;padding:0 1px!important;min-height:44px!important}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg4 button{min-height:38px;font-size:13px;padding:0 2px;font-weight:500}
.seg4 button.on{font-weight:700;--edge:#3E2619}
.shopg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shopi{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;text-align:center;min-width:0}
.shopi .btn{min-height:40px;padding:0 12px;font-size:15px}
.shopi .btn[disabled]{opacity:.55}
.shp{display:block;line-height:0;background:#CDE9F9;padding:4px;box-shadow:0 0 0 2px var(--ink)}
.rules{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.rules b{text-align:right;color:#2E7D4F}

/* more games */
.ghint{font-size:14px;line-height:1.25}
.turn[hidden]{display:none}
.gf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tlay #tscore,#tscore{font-size:14px;white-space:nowrap}
.tlay{display:flex;gap:10px;align-items:flex-start}
.tlay .tpad{grid-template-columns:1fr 1fr;flex:1;min-width:0}
.tlay .tboard{margin:0;flex:none;width:min(200px,calc((100vh - 340px)*10/18))}
.turn{display:flex;align-items:center;gap:8px;padding:4px 10px;min-height:38px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:min(250px,calc(100vh - 420px));width:100%;margin:0 auto}
.tc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:0;min-width:0;line-height:0}
.tc.wn{outline:4px solid var(--ink);outline-offset:-4px}
.c4g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#5FA6D8;padding:6px;box-shadow:0 0 0 3px var(--ink);max-width:min(340px,calc((100vh - 330px)*7/6));width:100%;margin:0 auto}
.cc{aspect-ratio:1;border-radius:50%;background:#FFFDF5;border:2px solid var(--ink);padding:0;min-width:0}
.cc.fa{background:#F4978E}.cc.fb{background:#F6C453}
.cc.wn{box-shadow:0 0 0 4px #fff,0 0 0 6px var(--ink)}
.pzg{display:grid;gap:3px;width:100%;max-width:min(320px,calc(100vh - 360px));margin:0 auto;aspect-ratio:1;background:var(--ink);padding:3px;box-shadow:0 0 0 3px var(--ink)}
.pt{border:0;padding:0;min-width:0;image-rendering:pixelated;background-color:#CDE9F9}
.pt.empty{background:#EFE3C8}
.uc{width:40px;height:58px;border:3px solid var(--ink);border-radius:6px;font-size:16px;padding:0;flex:none;box-shadow:0 3px 0 var(--ink)}
.uc.big{width:48px;height:68px;font-size:20px}
.uc.back{background:#3E3A57;color:#fff}
.uc.no{opacity:.55}
.uc.ok{transform:translateY(-4px)}
.uhand{display:flex;flex-wrap:wrap;gap:6px;padding:6px 2px}
.ucol{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.tboard{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(18,1fr);width:min(100%,240px,calc((100vh - 400px)*10/18));aspect-ratio:10/18;margin:0 auto;background:#CDE9F9;padding:3px}
.tboard i{display:block;background:rgba(255,255,255,.35);outline:1px solid rgba(91,58,41,.12);outline-offset:-1px}
.tpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpad .btn{min-height:44px;padding:0 4px;font-size:15px}

/* characters */
.pair2{display:flex;gap:12px;justify-content:space-around;text-align:center}
.who2{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pv{padding:6px;flex:none;line-height:0}
.opt{margin-top:14px}
.opt>span{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:8px}
.swb{width:42px;height:42px;box-shadow:0 0 0 2px var(--ink);margin:4px}
.swb.on{box-shadow:0 0 0 2px var(--ink),0 0 0 5px #F6C453}

/* transactions */
.dayh{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin:16px 0 2px}
.dayh:first-of-type{margin-top:4px}
.txrow{display:flex;align-items:center;gap:10px;min-height:46px;border-top:3px dotted var(--paper-lo);padding:6px 0}
.dayh+.txrow{border-top:0}

/* money */
.stat{font-size:40px;font-weight:700;line-height:1;text-shadow:3px 3px 0 #F6C453;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.priv{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:14px}
.splitbar{display:flex;height:16px;box-shadow:0 0 0 2px var(--ink);margin:12px 3px 8px;background:#EAD3A2}
.splitbar i{display:block;height:100%}
.leg{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:15px}
.leg span{display:flex;align-items:center;gap:6px}
.pill{display:inline-block;margin-top:12px;padding:6px 12px;font-size:15px;--t:3px}
.catrow{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;font-size:15px;min-height:30px}
.catbar{height:12px;background:#EAD3A2;box-shadow:0 0 0 2px var(--ink);margin:0 2px}
.catbar i{display:block;height:100%}
.exp{display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 0}
.expw{border-top:3px dotted var(--paper-lo)}
.expw:first-child{border-top:0}
.sw{width:14px;height:14px;box-shadow:0 0 0 2px var(--ink);flex:none;margin:0 3px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{min-width:44px;min-height:44px;background:none;font-size:22px;color:var(--muted)}
.goal{padding:14px}
.gtop{display:flex;gap:12px;align-items:flex-start}
.gtop h3{margin:0;font-size:21px;line-height:1.15;overflow-wrap:anywhere}
.gform{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.gform input{flex:1 1 90px;min-width:0}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.chip.on.g{--fill:#7BC67B;--hi:#A2DBA2;--lo:#5BAE5E}
.seg.two{grid-template-columns:1fr 1fr}

/* month overview */
#daycard{scroll-margin-top:96px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mnav{min-width:46px;min-height:46px;padding:0;font-size:20px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mh{text-align:center;font-size:13px;color:var(--muted);font-weight:700;padding-bottom:2px}
.mcell{min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#FFFDF5;box-shadow:0 0 0 2px var(--ink);margin:2px;font-size:15px;font-variant-numeric:tabular-nums;padding:0}
.mcell.blank{background:none;box-shadow:none}
.mcell.today{background:#F6C453}
.mcell.sel{box-shadow:0 0 0 2px var(--ink),0 0 0 5px #7BC67B}

/* lists */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:40px;font-size:14px;font-weight:500;transition:transform .08s}
.seg button.on{font-weight:700;--edge:#3E2619;transform:translateY(3px)}
.blocks{display:flex;gap:4px;margin:12px 3px 6px}
.blocks i{flex:1;height:14px;background:#EAD3A2;box-shadow:0 0 0 2px var(--ink)}
.blocks i.f{background:#7BC67B}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;text-align:left;background:none;border-top:3px dotted var(--paper-lo);padding:6px 0;font-size:17px}
.item:first-child{border-top:0}
.box{width:30px;height:30px;display:grid;place-items:center;flex:none;margin:3px;--t:3px;--fill:#FFFDF5;--hi:#FFFFFF;--lo:#EFE3C6;filter:none}
.item.done .box{--fill:#7BC67B;--hi:#A2DBA2;--lo:#5BAE5E}
.box .spr{opacity:0}.item.done .box .spr{opacity:1}
.item .box{border:0;padding:0;cursor:pointer;width:34px;height:34px}
.tbtn{background:none;border:0;text-align:left;font:inherit;color:inherit;padding:8px 0;min-height:44px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.ib{background:none;border:0;padding:0;min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer;flex:none;opacity:.9}
.evb{display:flex;gap:2px;flex:none;margin-left:auto}
.item.editing,.evedit{width:100%;flex-direction:column;align-items:stretch;gap:8px;padding:8px 0}
.evedit{display:flex}
.item.done .tx{text-decoration:line-through;text-decoration-thickness:3px;color:var(--muted)}
.by{width:12px;height:12px;flex:none;box-shadow:0 0 0 2px var(--ink)}
.by.a{background:#F4978E}.by.b{background:#8EC9F0}

/* notes */
.chat{display:flex;flex-direction:column;gap:14px}
.line{display:flex;align-items:flex-end;gap:8px}
.line.mine{flex-direction:row-reverse}
.msg{max-width:78%;padding:10px 14px;overflow-wrap:anywhere}
.msg small{display:block;font-size:12px;color:var(--muted);margin-top:3px}

/* memories timeline: a wooden path with a heart at each stop */
.tl{position:relative;display:flex;flex-direction:column;gap:22px;padding-left:36px}
.tl::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:6px;background:repeating-linear-gradient(#B07A4F 0 10px,#8F5F3B 10px 14px);box-shadow:0 0 0 3px var(--ink)}
.ent{position:relative;padding:14px;min-width:0}
.node{position:absolute;left:-37px;top:12px;width:24px;height:24px}
.year{position:relative;align-self:flex-start;padding:4px 14px;font-weight:700;font-size:18px;--t:3px}
.year .node{left:-45px;top:3px}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.date{display:inline-block;padding:3px 10px;font-size:14px;font-weight:700;--t:3px}
.ent h3{margin:10px 0 4px;font-size:21px;line-height:1.15}
.ent p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.heart{width:46px;height:46px;display:grid;place-items:center;margin:-6px -8px 0 0;background:none}
.heart:active{transform:scale(.9)}
.photo{padding:6px;margin:10px 4px 6px;--t:3px}
.photo .ph{overflow:hidden;background:#CDE9F9}
.photo .ph>*{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%;image-rendering:auto}
.photo .ph>svg{image-rendering:pixelated}
.ents{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.link{min-height:44px;padding:0 6px;background:none;color:var(--muted);font-size:15px;text-decoration:underline;text-decoration-style:dotted}
.ta{width:100%;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.35}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.sr:focus-visible+label{outline:3px dashed var(--ink);outline-offset:3px}
.fld{display:flex;flex-direction:column;gap:6px;width:100%}
.fld>span{font-size:14px;color:var(--muted);font-weight:700}
.prev{width:100%}
.prev .photo{margin-left:0;margin-right:0}
.empty{text-align:center;padding:18px 8px}

/* floating menu tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs>div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;pointer-events:auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;font-size:11px;font-weight:500;color:var(--text);
  animation:float 3s ease-in-out infinite;transition:transform .15s,filter .15s,background .15s}
.tab:nth-child(2){animation-delay:-.6s}.tab:nth-child(3){animation-delay:-1.2s}.tab:nth-child(4){animation-delay:-1.8s}.tab:nth-child(5){animation-delay:-2.4s}.tab:nth-child(6){animation-delay:-3s}
@media (max-width:400px){.tab{font-size:11px}}
.tab:nth-child(even){margin-top:7px}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -3px}}
@media (hover:hover){.tab:hover{transform:scale(1.07);filter:drop-shadow(0 6px 0 var(--shadow)) drop-shadow(0 0 8px rgba(246,196,83,.9))}}
.tab:active{transform:scale(.96)}
.tab.on{--edge:#F6C453;--fill:#FFFBEF;--hi:#FFFFFF;--lo:#FFE9A8;font-weight:700;
  filter:drop-shadow(0 6px 0 var(--shadow)) drop-shadow(0 0 7px rgba(246,196,83,.95))}
.tab .star{position:absolute;left:50%;top:-22px;margin-left:-10px;animation:bob 1.2s steps(2,jump-none) infinite}

.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));translate:-50% 20px;padding:10px 16px;z-index:20;
  max-width:88vw;text-align:center;color:#FFF4DA;opacity:0;pointer-events:none;transition:.25s;font-size:15px}
.toast.show{opacity:1;translate:-50% 0}
.badge{align-self:center;text-align:center;font-size:13px;color:var(--muted);padding:6px 12px;--t:3px;--fill:#FFFDF5;max-width:92%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* sign-in screen */
.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(#BFE3F7,#E7F5FF 60%,#9ED79A 60%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gcard{background:var(--paper);padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:360px;width:100%}
.gcard h2{margin:0;font-size:26px}.gcard p{margin:0}
.gart{display:flex;gap:8px;justify-content:center}
.gerr{color:#B3402F;font-size:14px;overflow-wrap:anywhere}.gtip{font-size:13px}


/* Date quests: a storybook look */
.qw .card{--fill:#FFF1D0;--hi:#FFFAE6;--lo:#E8CC96}
.qw .eyebrow{color:#6B4C8A}
.qsky{position:relative;overflow:hidden;background:linear-gradient(180deg,#3B2F63 0%,#6A58A0 55%,#E8A0A8 100%);padding:14px 14px 0}
.qsky .st{position:absolute;z-index:0;width:6px;height:6px;background:#FFE9A8;box-shadow:6px 0 #FFE9A8,-6px 0 #FFE9A8,0 6px #FFE9A8,0 -6px #FFE9A8;animation:qtw 2.6s ease-in-out infinite}
.qsky .moon{position:absolute;right:16px;top:12px;width:34px;height:34px;border-radius:50%;background:#FFE9A8;box-shadow:inset -9px -3px 0 #E7C46E}
.qhill{position:relative;height:34px;background:#7BC67B;box-shadow:inset 0 6px 0 #5BAE5E;margin:0 -14px}
.qhero-t{position:relative;font-size:26px;font-weight:700;line-height:1.05;color:#FFE9A8;text-shadow:3px 3px 0 #2A1F4A;max-width:70%}
.qbub{position:relative;background:#FFFDF5;color:#5B3A29;padding:8px 12px;margin:12px 0 0;font-size:14px;line-height:1.3;box-shadow:0 0 0 3px #5B3A29}
.qbub:after{content:"";position:absolute;bottom:-12px;left:34px;border:7px solid transparent;border-top:9px solid #5B3A29}
.qchars{display:flex;justify-content:center;align-items:flex-end;gap:26px;margin-top:20px;margin-bottom:-8px;position:relative;z-index:1}
.qchars>div:first-child{animation:qhop 2.4s ease-in-out infinite}.qchars>div:last-child{animation:qhop 2.4s ease-in-out .9s infinite}
.qgal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.qfr{position:relative;flex:none;width:min(78%,260px);aspect-ratio:4/3;scroll-snap-align:center;padding:4px;box-sizing:border-box}
.qfr img{width:100%;height:100%;object-fit:cover;display:block}
.qx{position:absolute;right:8px;top:8px;min-width:32px;height:32px;padding:0 6px;background:#FFFDF5;border:2px solid #5B3A29;font:inherit;font-weight:700;color:#5B3A29;cursor:pointer}
.qw{display:flex;flex-direction:column;gap:22px}
.qw>.card{padding:20px 18px}
.qw .eyebrow{margin-bottom:16px}
.qrow{padding:18px 0;border-top:2px dotted rgba(91,58,41,.28)}
.qw .eyebrow+.qrow,.qw .chips+.qrow{border-top:0;padding-top:4px}
.qrow:last-child{padding-bottom:0}
.qt{font-size:17px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.qsub{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:6px}
.qline{display:flex;align-items:center;justify-content:space-between;gap:16px}
.qline>div:first-child{min-width:0;flex:1}
.qlinks{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:14px}
.qlinks .link,.qlinks label.link{min-height:32px;display:inline-flex;align-items:center;white-space:nowrap;font-size:14px;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:4px}
.qw .chips{gap:12px;margin:0 0 14px}
.qw .qgal{margin-top:14px}
.qgal.one .qfr{width:100%}
.qpoint{animation:qbob 1.1s ease-in-out infinite}
.qchest{display:inline-block;animation:qwig 1.8s ease-in-out infinite;transform-origin:50% 100%}
.qspark{position:absolute;width:8px;height:8px;background:#F6C453;box-shadow:4px 0 #F6C453,-4px 0 #F6C453,0 4px #F6C453,0 -4px #F6C453;animation:qtw 2.2s ease-in-out infinite;pointer-events:none}
@keyframes qtw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes qhop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
@keyframes qbob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes qwig{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}84%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.qsky .st,.qchars>div,.qpoint,.qchest,.qspark{animation:none!important}}

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- pixel sprites: each letter is one coloured square ---------- */
const PAL={k:'#5B3A29',w:'#FFFDF5',c:'#F4978E',C:'#DE7B72',b:'#8EC9F0',B:'#5FA6D8',y:'#F6C453',Y:'#D99A2B',g:'#7BC67B',G:'#4E9E57',p:'#FFC2D1',n:'#A8714A',l:'#D7ECFA',r:'#E0455A'};
const mirror=h=>h.map(r=>r+[...r].reverse().join(''));
function spr(rows,px,pal){
  const P2=Object.assign({},PAL,pal||{}),w=Math.max(...rows.map(r=>r.length)),h=rows.length;let out='';
  rows.forEach((row,y)=>{let x=0;while(x<row.length){const ch=row[x];if(ch==='.'){x++;continue}let e=x;while(e<row.length&&row[e]===ch)e++;out+=`<rect x="${x}" y="${y}" width="${e-x}" height="1" fill="${P2[ch]||'#000'}"/>`;x=e}});
  return `<svg class="spr" viewBox="0 0 ${w} ${h}" width="${w*px}" height="${h*px}" shape-rendering="crispEdges" aria-hidden="true">${out}</svg>`;
}
const SP={
  home:mirror([".....k","....kc","...kcc","..kccc",".kcccc","kccccc",".kwwww",".kwbbw",".kwwyy",".kwwyy",".kkkkk","......"]),
  plan:mirror(["..k...","kkkkkk","kccccc","kccccc","kkkkkk","kwywww","kwwwww","kwwbww","kwwwww","kkkkkk","......","......"]),
  lists:["kkkkkkkkkkkk","kwwwwwwwwwwk","kwggwkkkkkwk","kwwwwwwwwwwk","kwggwkkkkkwk","kwwwwwwwwwwk","kwggwkkkkkwk","kwwwwwwwwwwk","kwwwwwwwwwwk","kkkkkkkkkkkk","............","............"],
  notes:mirror(["......","kkkkkk","kkwwww","kwkwww","kwwkww","kwwwkw","kwwwwk","kwwwww","kwwwww","kkkkkk","......","......"]),

  heart:mirror(["..kk..",".kppk.","kpwppk","kppppp","kppppp",".kpppp","..kppp","...kpp","....kp",".....k","......","......"]),
  flower:mirror(["..pp",".ppy","ppyy",".ppy","..pp","...g","..gg","...g"]),
  cloud:[".... wwww......".replace(' ',''),"..wwwwwwwwww..",".wwwwwwwwwwwww","wwwwwwwwwwwwww",".llllllllllll."],

  x:['k...k','.k.k.','..k..','.k.k.','k...k'],
  pencil:['.....kk','....kyk','...kyk.','..kyk..','.kyk...','kwk....','kk.....'],
  bfly:mirror(["k..k","kckk","kccC",".kcC","..kk"]),
  lock:["..kkkk..",".k....k.",".k....k.","kkkkkkkk","kyyyyyyk","kyykkyyk","kyyyyyyk","kkkkkkkk"],

};
const DANI=["....kk","..kkcy",".kcccc","kccccc","kcckcc","kcckcc","kpcccc","kcccck","kccccc",".kcccc","..kkkk","......"];
const RIN=["....gg","..kkcc",".kcccc","kccccc","kcckcc","kcckcc","kpcccc","kcccck","kccccc",".kcccc","..kkkk","......"];
const CH={a:{rows:mirror(DANI),pal:{}},b:{rows:mirror(RIN),pal:{c:'#8EC9F0',C:'#5FA6D8'}}};
/* ---------- characters: a bunny and a bear you can dress up ---------- */
const ANIMALS={bunny:'Bunny',bear:'Bear'};
const FURS={cream:['Cream','#FFF4DA'],honey:['Honey','#F0C987'],brown:['Brown','#B07A4F'],cocoa:['Cocoa','#7A4A2E'],grey:['Grey','#C9C6D2'],pink:['Pink','#FFC2D1'],lilac:['Lilac','#D9C7F0'],mint:['Mint','#C8EBD0']};
const HATS={none:'None',party:'Party hat',beanie:'Beanie',flowers:'Flowers',cap:'Cap',straw:'Straw hat',crown:'Crown',ribbon:'Ribbon bow',chef:'Chef hat',wizard:'Wizard hat',santa:'Santa hat'};
const OUTFITS={none:'Plain',tee:'T-shirt',sweater:'Sweater',overalls:'Overalls',scarf:'Scarf',bow:'Bow tie',apron:'Apron',hoodie:'Hoodie',cape:'Cape'};
const OCOLS={coral:['Coral','#F4978E','#DE7B72'],sky:['Sky','#8EC9F0','#5FA6D8'],gold:['Gold','#F6C453','#D99A2B'],leaf:['Leaf','#7BC67B','#4E9E57'],lilac:['Lilac','#D9C7F0','#B59BE0'],white:['White','#FFFDF5','#E6DCC0']};
function charGrid(C){
  const W=20,H=20,g=Array.from({length:H},()=>Array(W).fill('.'));
  const put=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=c};
  const rect=(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)put(x,y,c)};
  const inE=(x,y,cx,cy,rx,ry)=>{const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;return dx*dx+dy*dy<=1};
  const ell=(cx,cy,rx,ry,c)=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(inE(x,y,cx,cy,rx,ry))g[y][x]=c};
  const mir=(x,y,c)=>{put(x,y,c);put(19-x,y,c)};
  const bunny=C.animal!=='bear';
  const inHead=(x,y)=>bunny?inE(x,y,10,10.6,7.4,5.1):inE(x,y,10,10.6,7.6,5.3);
  const inBody=(x,y)=>inE(x,y,10,16.8,4.4,2.5);
  // ears
  if(bunny){ell(6.2,5.2,2.2,3.9,'f');ell(13.8,5.2,2.2,3.9,'f');ell(6.2,5.7,1.1,2.8,'p');ell(13.8,5.7,1.1,2.8,'p')}
  else{ell(4.7,6.4,2.4,2.4,'f');ell(15.3,6.4,2.4,2.4,'f');ell(4.7,6.6,1.2,1.2,'p');ell(15.3,6.6,1.2,1.2,'p')}
  // arms, feet, body, head
  ell(5.4,16.3,1.5,1.9,'f');ell(14.6,16.3,1.5,1.9,'f');
  ell(7.5,18.4,2.1,1.1,'f');ell(12.5,18.4,2.1,1.1,'f');
  ell(10,16.8,4.4,2.5,'f');
  if(bunny)ell(10,10.6,7.4,5.1,'f');else ell(10,10.6,7.6,5.3,'f');
  // belly and muzzle
  ell(10,17.2,2.6,1.5,bunny?'w':'m');
  if(!bunny)ell(10,13.2,3.2,2.2,'m');
  // soft shadow along the bottom edges of the fur
  for(let y=0;y<H-1;y++)for(let x=0;x<W;x++)if(g[y][x]==='f'&&g[y+1][x]==='.')g[y][x]='F';

  switch(C.outfit){
    case 'tee':body((x,y)=>put(x,y,y>=18?'O':'o'));ell(5.4,16.3,1.5,1.9,'o');ell(14.6,16.3,1.5,1.9,'o');break;

function wheelSvg(){
  const C=110,R=84,SL='#8E7DB0',TX='#5B4A7A',GD='#E2B873',CR='#FFF6E0',pt=(a,r)=>[(C+r*Math.sin(a*Math.PI/180)).toFixed(2),(C-r*Math.cos(a*Math.PI/180)).toFixed(2)];
  const SP4=r=>`M0-${r}Q0 0 ${r} 0Q0 0 0 ${r}Q0 0-${r} 0Q0 0 0-${r}z`,tw=(x,y,r,f,i)=>`<g transform="translate(${x} ${y})"><path class="wsp" style="animation-delay:-${((i*.37)%2.4).toFixed(2)}s" d="${SP4(r)}" fill="${f}"/></g>`;
  let orn='',wed='',spk='',lab='';
  for(let i=0;i<16;i++){const[ox,oy]=pt(i*22.5,92);orn+=i%2===0?tw(ox,oy,5,'#F3CD7A',i+3):`<path d="M0-3.4L2.5 0 0 3.4-2.5 0z" transform="translate(${ox} ${oy})" fill="${SL}" opacity=".7"/>`}
  QORDER.forEach((k,i)=>{const a0=i*90,a1=a0+90,m=a0+45,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[tx,ty]=pt(m,50),rot=m<180?m-90:m+90,f=hexMix(QKIND_COL[k],'#FFFFFF',.3),cs=[[14,74],[36,68],[56,76],[76,70]].map(([d,r])=>pt(a0+d,r));
    wed+=`<path d="M${C} ${C}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${f}" stroke="${SL}" stroke-width="2.5" stroke-linejoin="round"/>`
    +`<polyline points="${cs.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1" stroke-dasharray="2 2"/>`+cs.map((q,j)=>j===1?tw(q[0],q[1],4,'#fff',i+j):`<circle cx="${q[0]}" cy="${q[1]}" r="1.7" fill="#fff"/>`).join('');
    lab+=`<text x="${tx}" y="${ty}" transform="rotate(${rot} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" letter-spacing=".08em" fill="${TX}" stroke="${f}" stroke-width="5" stroke-linejoin="round" paint-order="stroke">${QKINDS[k].toUpperCase()}</text>`});
  for(let a=0;a<360;a+=45){const[x,y]=pt(a,R);spk+=`<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="#FFFBEA" stroke-width="${a%90?1.6:3}" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="2.8" fill="#F9DC93" stroke="${SL}" stroke-width="1.2"/>`}
  return `<svg viewBox="-8 -8 236 236" width="240" height="240" style="max-width:100%;display:block" role="img" aria-label="Quest wheel"><defs><linearGradient id="wgold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3CF"/><stop offset=".5" stop-color="#F9DC93"/><stop offset="1" stop-color="#E9C376"/></linearGradient><pattern id="wdth" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1.3" height="1.3" fill="${SL}" opacity=".12"/><rect x="2" y="2" width="1.3" height="1.3" fill="${SL}" opacity=".12"/></pattern></defs><circle cx="110" cy="110" r="106" fill="url(#wgold)" stroke="${SL}" stroke-width="3"/><circle cx="110" cy="110" r="102" fill="none" stroke="${CR}" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/><circle class="wgl" cx="110" cy="110" r="106" fill="none" stroke="#FFF3CF" stroke-width="4"/><circle cx="110" cy="110" r="98" fill="${CR}" stroke="${SL}" stroke-width="2.5"/>${orn}${wed}<circle cx="110" cy="110" r="${R}" fill="url(#wdth)"/><circle cx="110" cy="110" r="${R+1.5}" fill="none" stroke="${GD}" stroke-width="2.5"/>${spk}${lab}<circle cx="110" cy="110" r="21" fill="url(#wgold)" stroke="${SL}" stroke-width="3"/><circle cx="110" cy="110" r="15" fill="${CR}" stroke="${GD}" stroke-width="1.5"/><g transform="translate(110 110)"><g class="wsp"><path d="${SP4(13)}" fill="#F3CD7A"/><path d="${SP4(9)}" fill="#F9DC93" transform="rotate(45)"/></g></g><circle cx="110" cy="110" r="2.6" fill="#fff"/></svg>`;
}

function shrinkImg(f){return new Promise((ok,no)=>{const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{const k=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.75))};img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('bad'))};img.src=url})}

  render();queueSync();
});

function qAct(a,v){

  if(a==='qf'){S.qf=v;S.qpick=null}
  else if(a==='qspin'){

    const x=l[Math.floor(Math.random()*l.length)],i=QORDER.indexOf(x.k),local=i*90+12+Math.random()*66;
    let target=Math.floor(S.qwdeg/360)*360+360*5+((360-local)%360);if(target<S.qwdeg+720)target+=360;
    const el=document.getElementById('wheel'),pc=document.getElementById('qpickcard');if(pc)pc.style.visibility='hidden';
    QSPIN=true;
    if(el){el.style.transition='transform 4s cubic-bezier(.17,.67,.2,1)';void el.offsetWidth;el.style.transform='rotate('+target+'deg)'}
    setTimeout(()=>{QSPIN=false;S.qwdeg=target;S.qpick=x.id;render()},el?4150:0);
  }
  else if(a==='qchest'){
    const avl=Math.floor(S.q.done.length/5)-(S.q.chests||0);if(avl<=0)return;S.q.chests=(S.q.chests||0)+1;
    const k=me(),pool=[];['hat','outfit'].forEach(t=>Object.keys(SHOP[t]||{}).forEach(id=>{if(!S.own[k].includes(t+':'+id))pool.push([t,id])}));
    const lk=['mm','db'].filter(g=>!(S.q.unl||[]).includes(g));
    if(lk.length&&Math.random()<.4){const g=lk[Math.floor(Math.random()*lk.length)];S.q.unl=(S.q.unl||[]).concat(g);S.qprize='You unlocked a new game: '+TITLES[g]+'! Find it in More, under Games.';toast('New game unlocked!')}
    else if(pool.length&&Math.random()<.35){const [t,id]=pool[Math.floor(Math.random()*pool.length)];S.own[k].push(t+':'+id);S.qprize='You found: '+itemName(t,id)+'! It is in your Shop now.';toast('Treasure!')}
    else{const c=[20,30,30,40,50][Math.floor(Math.random()*5)];S.coins[k]+=c;S.cl.unshift({k,n:c,why:'Treasure chest'});S.cl=S.cl.slice(0,30);S.qprize='+'+c+' coins!';toast('Treasure!')}
  }
  else if(a==='qprizeok'){S.qprize=null}
  else if(a==='qtake'){const x=find(v);if(x&&!q.act.some(y=>y.id===v)){q.act.push({id:x.id,t:x.t,k:x.k,planned:false});toast('Quest taken')}S.qpick=null}
  else if(a==='qdrop'){q.act=q.act.filter(x=>x.id!==v)}
  else if(a==='qdone'){const x=q.act.find(y=>y.id===v);if(x){q.act=q.act.filter(y=>y.id!==v);q.done.push({id:x.id,t:x.t,k:x.k,date:todayIso(),by:me()});S.qmem={t:x.t,id:x.id};earn(5,'Quest finished')}}
  else if(a==='qplan'){const x=q.act.find(y=>y.id===v);if(x&&!x.planned){const d=isoOff(1);S.events.push({date:d,d:dayDiff(d),t:'18:00',title:'Quest: '+x.t,who:'both'});x.planned=true;toast('Added to Plan for tomorrow. You can change it there.')}}
  else if(a==='qmemyes'){if(S.qmem){S.mems.push({id:uid2(),date:todayIso(),title:S.qmem.t,text:'Date quest finished.',fav:false,qid:S.qmem.id,photo:((qPhotos(S.qmem.id)[0]||{}).photo)||null,photos:qPhotos(S.qmem.id).slice(0,5).map(x=>x.photo)});S.qmem=null;toast('Saved to your Memories')}}
  else if(a==='qtalemem'){const x=S.q.done.find(y=>y.id===v);if(x&&!S.mems.some(m=>m.qid===v)){const ph=qPhotos(v).slice(0,5).map(y=>y.photo);S.mems.push({id:uid2(),date:x.date||todayIso(),title:x.t,text:'Date quest finished.',fav:false,qid:v,photo:ph[0]||null,photos:ph});toast('Saved to your Memories')}}
  else if(a==='qmemno'){S.qmem=null}
  else if(a==='qphdel'){if(S.qphc===v){S.qph=S.qph.filter(x=>x.id!==v);S.qphc=null;toast('Photo removed')}else S.qphc=v}
  else if(a==='qall'){S.qall=!S.qall}
  else if(a==='qpe'){S.qpe=S.qpe===String(v)?null:String(v);S.qphc=null}
  else if(a==='qadd'){S.qadd=true}
  else if(a==='qcancel'){S.qadd=false}
  else if(a==='qdel'){q.mine=q.mine.filter(x=>x.id!==v)}
  else if(a==='qlog'){S.qlog=!S.qlog}
  else if(a==='qscene'){S.qsc=((S.qsc==null?QSC0:S.qsc)+1)%3}
}

function monthHtml(){
  const t=new Date();t.setHours(0,0,0,0);
  const first=new Date(t.getFullYear(),t.getMonth()+(S.mon||0),1);
  const dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const lead=(first.getDay()+6)%7;
  const label=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  let cells='',count=0;
  for(let i=0;i<lead;i++)cells+='<span class="mcell blank"></span>';
  for(let d=1;d<=dim;d++){
    const date=new Date(first.getFullYear(),first.getMonth(),d),off=Math.round((date-t)/864e5);
    const evs=S.events.filter(e=>e.d===off);count+=evs.length;
    const kinds=[...new Set(evs.map(e=>e.who))];
    cells+=`<button class="mcell ${off===0?'today':''} ${off===S.day?'sel':''}" data-act="mday" data-v="${off}" aria-label="${date.toDateString()}, ${evs.length} plans"><b>${d}</b><span class="dots">${kinds.map(k=>`<i class="dot ${k}"></i>`).join('')}</span></button>`;
  }
  return `<section class="card px">
    <p class="eyebrow">${FL(2)}Month overview</p>
    <div class="mhead"><button class="btn px s c-white mnav" data-act="mprev" aria-label="Previous month">&lt;</button>
      <div style="text-align:center"><h2>${label}</h2><div class="muted" style="font-size:14px">${count} ${count===1?'plan':'plans'} this month</div></div>
      <button class="btn px s c-white mnav" data-act="mnext" aria-label="Next month">&gt;</button></div>
    <div class="mgrid">${['M','T','W','T','F','S','S'].map(x=>`<span class="mh">${x}</span>`).join('')}${cells}</div>
  </section>`;
}

function fmtSigned(n){return (n<0?'-':'+')+'B$'+Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dayLabel(iso){const [y,m,d]=iso.split('-').map(Number),dt=new Date(y,m-1,d);return dt.toLocaleDateString('en-GB',{weekday:'short'})+', '+dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}

function pieSvg(parts){
  const tot=parts.reduce((a,x)=>a+x.v,0),R=70,C=80;let a0=-Math.PI/2,out='';
  if(parts.length===1)out=`<circle cx="${C}" cy="${C}" r="${R}" fill="${parts[0].c}" stroke="#3E2619" stroke-width="3"/>`;
  else parts.forEach(x=>{const a1=a0+x.v/tot*2*Math.PI,l=a1-a0>Math.PI?1:0,pt=a=>[(C+R*Math.cos(a)).toFixed(2),(C+R*Math.sin(a)).toFixed(2)];
    const [x0,y0]=pt(a0),[x1,y1]=pt(a1);out+=`<path d="M${C} ${C}L${x0} ${y0}A${R} ${R} 0 ${l} 1 ${x1} ${y1}Z" fill="${x.c}" stroke="#3E2619" stroke-width="3" stroke-linejoin="round"/>`;a0=a1});
  return `<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Pie chart" style="flex:none;max-width:100%">${out}</svg>`;
}
function txPie(tx,f){
  const per=S.txp||'month',ym=todayIso().slice(0,7);
  const rows=tx.filter(x=>per==='all'||x.date.startsWith(ym));
  const sum=(arr,key,col)=>{const m={};arr.forEach(x=>{const k=key(x);m[k]=m[k]||{n:k,v:0,c:col(x)};m[k].v+=Math.abs(x.amt)});return Object.values(m).filter(x=>x.v>0.004).sort((a,b)=>b.v-a.v)};
  let parts,title;
  if(f==='spend'){parts=sum(rows.filter(x=>x.kind==='spend'),x=>x.s,x=>x.c);title='Where your spending went'}
  else if(f==='inc'){const pal=['#7BC67B','#8EC9F0','#F6C453','#D9C7F0','#F4978E','#EAD3A2'];let i=0;parts=sum(rows.filter(x=>x.kind==='inc'),x=>x.t,()=>pal[i++%pal.length]);title='Where your income came from'}
  else if(f==='save'){const pal=['#F6C453','#8EC9F0','#7BC67B','#D9C7F0','#F4978E','#EAD3A2'];let i=0;const m={};rows.filter(x=>x.kind==='save').forEach(x=>{m[x.t.replace(/^(Added to |Taken out of )/,'')]=(m[x.t.replace(/^(Added to |Taken out of )/,'')]||0)+x.amt});parts=Object.entries(m).filter(([,v])=>v>0.004).map(([n,v])=>({n,v,c:pal[i++%pal.length]})).sort((a,b)=>b.v-a.v);title='Savings by goal'}
  else{const t=k=>rows.filter(x=>x.kind===k).reduce((a,x)=>a+Math.max(0,x.amt)+(k==='spend'?-x.amt:0),0);
    parts=[{n:'Spent',v:t('spend'),c:'#F4978E'},{n:'Saved',v:t('save'),c:'#F6C453'}].filter(x=>x.v>0.004);const inc=rows.filter(x=>x.kind==='inc').reduce((a,x)=>a+x.amt,0),left=inc-parts.reduce((a,x)=>a+x.v,0);
    if(left>0.004)parts.push({n:'Left over',v:left,c:'#7BC67B'});title=inc>0?'What happened to your income':'Spent and saved'}
  const chips=`<div class="chips" style="margin:0 0 12px">${[['month','This month'],['all','All time']].map(([k,l])=>`<button class="chip px s ${per===k?'on g':'c-white'}" data-act="txp" data-v="${k}">${l}</button>`).join('')}</div>`;
  const tot=parts.reduce((a,x)=>a+x.v,0);
  const body=parts.length?`<div style="display:flex;flex-direction:column;align-items:center;gap:14px">${pieSvg(parts)}<div style="width:100%">${parts.map(x=>`<div class="row" style="gap:8px;margin:6px 0"><span class="sw" style="background:${x.c};flex:none"></span><span class="grow" style="overflow-wrap:anywhere;min-width:0">${esc(x.n)}</span><b>${money(x.v)}</b><span class="muted" style="font-size:13px;min-width:38px;text-align:right">${Math.round(x.v/tot*100)}%</span></div>`).join('')}</div></div>`:'<div class="muted">Nothing to show for this yet.</div>';
  return `<section class="card px"><p class="eyebrow">${FL(2)}${title}</p>${chips}${body}<div class="muted" style="font-size:13px;margin-top:12px">Pick All, Spending, Income or Savings below to change this chart.</div></section>`;
}

function shrinkMem(f){return new Promise((ok,no)=>{const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{const k=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.7))};img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('bad'))};img.src=url})}
document.addEventListener('change',async e=>{
  const t=e.target;if(!t||!t.id)return;
  const isNew=t.id==='memfile',mid=t.dataset&&t.dataset.mid;if(!isNew&&!mid)return;
  const files=[...(t.files||[])];t.value='';if(!files.length)return;
  const m=isNew?null:S.mems.find(x=>String(x.id)===mid);if(!isNew&&!m)return;
  let cur=isNew?S.mphotos.slice():memPhotos(m).slice();
  const room=5-cur.length;if(room<=0){toast('That is plenty of photos for one memory');return}
  toast('Adding photos...');
  for(const f of files.slice(0,room)){
    try{const d=await shrinkMem(f);if(JSON.stringify(cur).length+d.length>850000){toast('That memory is full of photos');break}cur.push(d)}catch(err){toast('That file could not be opened as a picture.')}
  }
  if(isNew){
    S.mphotos=cur;
    const keep={t:$('#memtitle')&&$('#memtitle').value,d:$('#memdate')&&$('#memdate').value,x:$('#memtext')&&$('#memtext').value};
    render();
    if($('#memtitle')){$('#memtitle').value=keep.t;$('#memdate').value=keep.d;$('#memtext').value=keep.x}
  }else{m.photos=cur;m.photo=cur[0]||null;render();queueSync()}
});

function buildFx(k){
  const r=(a,b)=>a+Math.random()*(b-a);let h='';
  if(k==='rainy'){for(let i=0;i<46;i++)h+=`<i style="left:${r(0,100)}%;animation-duration:${r(.7,1.4)}s;animation-delay:-${r(0,2)}s"></i>`;return `<div class="rain">${h}</div>`}
  if(k==='night'){for(let i=0;i<34;i++)h+=`<i style="left:${r(0,100)}%;top:${r(0,62)}%;animation-delay:-${r(0,2.4)}s"></i>`;return `<div class="stars">${h}</div><span style="position:absolute;right:22px;top:128px">${spr(SP.moon,5)}</span>`}
  if(k==='autumn'){const cols=['#E0573D','#F08A3C','#F6C453','#B5542C'];for(let i=0;i<16;i++)h+=`<i style="left:${r(0,100)}%;background:${cols[i%4]};animation-duration:${r(7,13)}s;animation-delay:-${r(0,12)}s"></i>`;return `<div class="leafs">${h}</div>`}
  if(k==='festive'){const cols=['#F4978E','#F6C453','#8EC9F0','#7BC67B'];let l='',s='';for(let i=0;i<14;i++)l+=`<i style="left:${i*(100/13)}%;top:${112+(i%2?4:0)}px;background:${cols[i%4]};animation-delay:-${(i%4)*.4}s"></i>`;for(let i=0;i<14;i++)s+=`<i style="left:${r(0,100)}%;background:${cols[(i+1)%4]};animation-duration:${r(8,14)}s;animation-delay:-${r(0,14)}s"></i>`;return `<div class="wire"></div><div class="lights">${l}</div><div class="spark">${s}</div>`}
  return '';
}

function resultsHtml(){

const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
SP.sudoku=["kkkkkkkkkk","kwwkcckwwk","kwwkwwkbbk","kkkkkkkkkk","kbbkwwkwwk","kwwkwwkccx","kkkkkkkkkk","kwwkccdwwk","kwwkwwkwwk","kkkkkkkkkk"].map(r=>r.replace(/[xd]/g,'k'));

/* ----- Sudoku ----- */
const SU_CLUES={easy:38,medium:31,hard:26};
function suSolve(grid,limit,rand){
  const g=grid.slice(),rows=Array(9).fill(0),cols=Array(9).fill(0),boxes=Array(9).fill(0),bx=i=>((i/27)|0)*3+(((i%9)/3)|0);
  for(let i=0;i<81;i++){const v=g[i];if(!v)continue;const b=1<<v,r=(i/9)|0;if((rows[r]&b)||(cols[i%9]&b)||(boxes[bx(i)]&b))return {n:0,sol:null};rows[r]|=b;cols[i%9]|=b;boxes[bx(i)]|=b}
  let n=0,sol=null;
  const pc=m=>{let c=0;while(m){m&=m-1;c++}return c};
  (function rec(){
    let best=-1,bm=0,bn=10;
    for(let i=0;i<81;i++){if(g[i])continue;const m=~(rows[(i/9)|0]|cols[i%9]|boxes[bx(i)])&0x3FE,c=pc(m);if(c<bn){bn=c;best=i;bm=m;if(c<2)break}}
    if(best<0){n++;if(!sol)sol=g.slice();return n>=limit}
    if(!bn)return false;
    const ds=[];for(let v=1;v<=9;v++)if(bm&(1<<v))ds.push(v);if(rand)shuf(ds);
    const r=(best/9)|0,c=best%9,k=bx(best);
    for(const v of ds){const b=1<<v;g[best]=v;rows[r]|=b;cols[c]|=b;boxes[k]|=b;if(rec())return true;g[best]=0;rows[r]&=~b;cols[c]&=~b;boxes[k]&=~b}
    return false;
  })();
  return {n,sol};
}
function suNew(diff){
  const full=suSolve(Array(81).fill(0),1,true).sol,puz=full.slice();
  let clues=81;

    if(clues<=SU_CLUES[diff])break;
    const v=puz[i];puz[i]=0;
    if(suSolve(puz,2).n!==1)puz[i]=v;else clues--;
  }
  S.su={diff,sol:full,giv:puz.slice(),cur:puz.slice(),who:Array(81).fill(''),notes:Array(81).fill(0),sel:-1,pencil:false,t0:Date.now(),endT:0,done:false,hints:0,mistakes:0,hist:[],showErr:false,confirm:false};
}
const suPeer=(a,b)=>{const ar=(a/9)|0,br=(b/9)|0,ac=a%9,bc=b%9;return ar===br||ac===bc||((ar/3|0)===(br/3|0)&&(ac/3|0)===(bc/3|0))};
function suConf(su,i){const v=su.cur[i];if(!v)return false;for(let k=0;k<81;k++)if(k!==i&&su.cur[k]===v&&suPeer(i,k))return true;return false}

/* ----- Scrabble ----- */
const SC_DIST={A:9,B:2,C:2,D:4,E:12,F:2,G:3,H:2,I:9,J:1,K:1,L:4,M:2,N:6,O:8,P:2,Q:1,R:6,S:4,T:6,U:4,V:2,W:2,X:1,Y:2,Z:1,'?':2};
const SC_VAL={A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10,'?':0};
const SC_PREM=(()=>{
  const m=Array.from({length:15},()=>Array(15).fill(''));
  const set=(t,list)=>list.forEach(([r,c])=>{[[r,c],[r,14-c],[14-r,c],[14-r,14-c],[c,r],[c,14-r],[14-c,r],[14-c,14-r]].forEach(([y,x])=>{m[y][x]=t})});
  set('TW',[[0,0],[0,7]]);set('DW',[[1,1],[2,2],[3,3],[4,4]]);set('TL',[[1,5],[5,5]]);set('DL',[[0,3],[2,6],[3,7],[6,6]]);
  m[7][7]='ST';return m;
})();
const scDict=()=>(window._sd&&window._sd.size?window._sd:{has:()=>true});
const scOther=k=>k==='a'?'b':'a';
function scNew(){
  const bag=[];for(const [l,n] of Object.entries(SC_DIST))for(let i=0;i<n;i++)bag.push({l});
  shuf(bag);
  const sc={board:Array.from({length:15},()=>Array(15).fill(null)),bag,racks:{a:[],b:[]},scores:{a:0,b:0},turn:'a',pend:{},sel:-1,passes:0,log:[],over:false,zoom:false,blank:null,warn:null,first:true,swap:null,confirm:false};
  ['a','b'].forEach(k=>scDraw(sc,k));S.sc=sc;
}
function scDraw(sc,k){while(sc.racks[k].length<7&&sc.bag.length)sc.racks[k].push(sc.bag.pop())}
function scTileAt(sc,x,y){if(x<0||y<0||x>14||y>14)return null;const p=sc.pend[x+','+y];return p?{l:p.l,blank:p.blank,pend:true}:sc.board[y][x]}
function scWord(sc,x,y,dx,dy){let sx=x,sy=y;while(scTileAt(sc,sx-dx,sy-dy)){sx-=dx;sy-=dy}const cells=[];let cx=sx,cy=sy;while(scTileAt(sc,cx,cy)){cells.push({x:cx,y:cy,t:scTileAt(sc,cx,cy)});cx+=dx;cy+=dy}return cells}
function scScoreWord(cells){let sum=0,wm=1;for(const c of cells){let v=c.t.blank?0:SC_VAL[c.t.l];if(c.t.pend){const pr=SC_PREM[c.y][c.x];if(pr==='DL')v*=2;else if(pr==='TL')v*=3;else if(pr==='DW'||pr==='ST')wm*=2;else if(pr==='TW')wm*=3}sum+=v}return sum*wm}
function scEval(sc){
  const ps=Object.values(sc.pend);if(!ps.length)return {ok:false,err:'',empty:true};
  const xs=new Set(ps.map(p=>p.x)),ys=new Set(ps.map(p=>p.y));
  if(ps.length>1&&xs.size>1&&ys.size>1)return {ok:false,err:'Tiles must be in one row or one column.'};
  const horiz=ps.length>1?ys.size===1:null;
  if(ps.length>1){
    if(horiz){const y=ps[0].y,a=Math.min(...xs),b=Math.max(...xs);for(let x=a;x<=b;x++)if(!scTileAt(sc,x,y))return {ok:false,err:'No gaps allowed between tiles.'}}
    else{const x=ps[0].x,a=Math.min(...ys),b=Math.max(...ys);for(let y=a;y<=b;y++)if(!scTileAt(sc,x,y))return {ok:false,err:'No gaps allowed between tiles.'}}
  }
  if(sc.first){
    if(!ps.some(p=>p.x===7&&p.y===7))return {ok:false,err:'The first word must cover the star.'};
    if(ps.length<2)return {ok:false,err:'The first word needs at least 2 tiles.'};
  }else{
    const touch=ps.some(p=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>!!(sc.board[p.y+dy]&&sc.board[p.y+dy][p.x+dx])));

  }
  const words=[],seen=new Set();
  const add=cells=>{if(cells.length<2)return;const key=cells[0].x+','+cells[0].y+(cells[0].x===cells[1].x?'v':'h');if(seen.has(key))return;seen.add(key);words.push({w:cells.map(c=>c.t.l).join(''),pts:scScoreWord(cells)})};
  if(ps.length===1){add(scWord(sc,ps[0].x,ps[0].y,1,0));add(scWord(sc,ps[0].x,ps[0].y,0,1))}
  else if(horiz){add(scWord(sc,ps[0].x,ps[0].y,1,0));ps.forEach(p=>add(scWord(sc,p.x,p.y,0,1)))}
  else{add(scWord(sc,ps[0].x,ps[0].y,0,1));ps.forEach(p=>add(scWord(sc,p.x,p.y,1,0)))}

function scFinish(sc,out){
  const pen={};['a','b'].forEach(k=>{pen[k]=sc.racks[k].reduce((s,t)=>s+SC_VAL[t.l],0)});
  if(out){sc.scores[out]+=pen[scOther(out)];sc.scores[scOther(out)]-=pen[scOther(out)]}

function scRecall(sc){Object.values(sc.pend).forEach(p=>sc.racks[sc.turn].push(p.tile));sc.pend={};sc.sel=-1;sc.blank=null;sc.warn=null}
function scNext(sc){sc.turn=scOther(sc.turn);sc.sel=-1;sc.swap=null;sc.warn=null;sc.blank=null}
function scPlay(sc,accept){
  const ev=scEval(sc);
  if(!ev.ok){if(ev.err)toast(ev.err);return}
  if(ev.invalid.length&&!accept){sc.warn=ev.invalid;return}
  const k=sc.turn;
  Object.values(sc.pend).forEach(p=>{sc.board[p.y][p.x]={l:p.l,blank:p.blank}});
  sc.scores[k]+=ev.total;sc.log.unshift(`${P[k].name} played ${ev.words[0].w}${ev.words.length>1?' +'+(ev.words.length-1):''} for ${ev.total}${ev.bingo?' (bonus!)':''}`);
  sc.pend={};sc.passes=0;sc.first=false;scDraw(sc,k);
  if(!sc.bag.length&&!sc.racks[k].length){scFinish(sc,k);sc.log.unshift(`${P[k].name} used every tile`);return}
  scNext(sc);
}
function gameAct(a,v){
  const su=S.su,sc=S.sc;
  if(a.startsWith('su-')){
    switch(a){
      case 'su-sel':su.sel=su.sel===+v?-1:+v;break;
      case 'su-num':{
        const d=+v,i=su.sel;if(su.done)break;
        if(i<0){toast('Tap a square first');break}
        if(su.giv[i]){toast('That square is already given');break}
        if(su.pencil){if(su.cur[i]){toast('Erase the number first to use notes');break}su.notes[i]^=(1<<d);break}
        su.hist.push({i,cur:su.cur[i],who:su.who[i],notes:su.notes[i]});
        if(su.cur[i]===d){su.cur[i]=0;su.who[i]=''}
        else{su.cur[i]=d;su.who[i]=me();su.notes[i]=0;if(d!==su.sol[i])su.mistakes++;for(let k=0;k<81;k++)if(suPeer(i,k))su.notes[k]&=~(1<<d)}

      case 'su-erase':{const i=su.sel;if(i<0||su.giv[i]||su.done)break;su.hist.push({i,cur:su.cur[i],who:su.who[i],notes:su.notes[i]});su.cur[i]=0;su.who[i]='';su.notes[i]=0;break}
      case 'su-pencil':su.pencil=!su.pencil;break;
      case 'su-undo':{const h=su.hist.pop();if(h&&!su.done){su.cur[h.i]=h.cur;su.who[h.i]=h.who;su.notes[h.i]=h.notes;su.sel=h.i}break}
      case 'su-hint':{
        if(su.done)break;
        let i=su.sel;if(i<0||su.giv[i]||su.cur[i]===su.sol[i]){i=su.cur.findIndex((x,k)=>x!==su.sol[k])}
        if(i<0)break;
        su.hist.push({i,cur:su.cur[i],who:su.who[i],notes:su.notes[i]});
        su.cur[i]=su.sol[i];su.who[i]='h';su.notes[i]=0;su.sel=i;su.hints++;suDone(su);break}
      case 'su-check':{su.showErr=true;const bad=su.cur.filter((x,k)=>x&&!su.giv[k]&&x!==su.sol[k]).length;toast(bad?bad+(bad===1?' number is':' numbers are')+' wrong':'No mistakes so far');break}
      case 'su-diff':su.diff=v;break;
      case 'su-new':if(su.done||!su.hist.length)suNew(su.diff);else su.confirm=true;break;
      case 'su-newyes':suNew(su.diff);break;
      case 'su-newno':su.confirm=false;break;

      sc.sel=sc.sel===i?-1:i;break}
    case 'sc-cell':{
      if(!mine)break;const [x,y]=v.split(',').map(Number),k=x+','+y;
      if(sc.board[y][x])break;
      if(sc.pend[k]){rack.push(sc.pend[k].tile);delete sc.pend[k];sc.warn=null;break}
      if(sc.sel<0){toast('Tap a tile in your rack first');break}
      const tile=rack[sc.sel];
      if(tile.l==='?'){sc.blank={x,y};break}
      rack.splice(sc.sel,1);sc.pend[k]={x,y,l:tile.l,tile,blank:false};sc.sel=-1;sc.warn=null;break}
    case 'sc-letter':{const {x,y}=sc.blank,tile=rack[sc.sel];rack.splice(sc.sel,1);sc.pend[x+','+y]={x,y,l:v,tile,blank:true};sc.sel=-1;sc.blank=null;sc.warn=null;break}
    case 'sc-blankx':sc.blank=null;break;
    case 'sc-play':if(mine)scPlay(sc,false);break;
    case 'sc-accept':if(mine)scPlay(sc,true);break;
    case 'sc-recall':if(mine)scRecall(sc);break;
    case 'sc-shuffle':if(mine)shuf(rack);break;
    case 'sc-pass':{if(!mine)break;scRecall(sc);sc.log.unshift(`${P[sc.turn].name} passed`);sc.passes++;if(sc.passes>=6){scFinish(sc,null);break}scNext(sc);break}
    case 'sc-swap':{if(!mine)break;scRecall(sc);if(sc.bag.length<7){toast('Not enough tiles left in the bag to swap');break}sc.swap=new Set();break}
    case 'sc-swapx':sc.swap=null;break;
    case 'sc-swapgo':{
      if(!mine||!sc.swap||!sc.swap.size)break;
      const out=[...sc.swap].sort((p,q)=>q-p).map(i=>rack.splice(i,1)[0]);
      scDraw(sc,sc.turn);sc.bag.push(...out);shuf(sc.bag);
      sc.log.unshift(`${P[sc.turn].name} swapped ${out.length} tile${out.length===1?'':'s'}`);sc.passes++;scNext(sc);break}
    case 'sc-zoom':sc.zoom=!sc.zoom;break;
    case 'sc-new':if(sc.over||sc.moves===0||!sc.log.length)scNew();else sc.confirm=true;break;
    case 'sc-newyes':scNew();break;
    case 'sc-newno':sc.confirm=false;break;
  }
}

  const c=b[i],r=(i/7)|0,x=i%7;

/* tetris */
const TP={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const TCOL={I:'#8EC9F0',O:'#F6C453',T:'#C9A6E8',S:'#7BC67B',Z:'#F4978E',J:'#5FA6D8',L:'#E8A55A'};
function teNew(){
  if(S.gm.te&&S.gm.te.timer)clearInterval(S.gm.te.timer);
  const t={b:Array.from({length:18},()=>Array(10).fill('')),score:0,lines:0,over:false,paused:false,timer:null,paid:false};
  teSpawn(t);S.gm.te=t;t.timer=setInterval(teTick,650);
}
function teSpawn(t){const k=Object.keys(TP)[Math.floor(Math.random()*7)];t.p={k,m:TP[k].map(r=>r.slice()),x:3,y:0};if(teHit(t,t.p.m,t.p.x,t.p.y)){t.over=true;teStop(t)}}
function teHit(t,m,x,y){return m.some((r,j)=>r.some((v,i)=>v&&(x+i<0||x+i>=10||y+j>=18||(y+j>=0&&t.b[y+j][x+i]))))}
function teRot(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function teLock(t){
  t.p.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&t.p.y+j>=0)t.b[t.p.y+j][t.p.x+i]=t.p.k}));
  let n=0;for(let y=17;y>=0;y--)if(t.b[y].every(c=>c)){t.b.splice(y,1);t.b.unshift(Array(10).fill(''));n++;y++}
  t.lines+=n;t.score+=[0,100,300,500,800][n]+5;teSpawn(t);
}
function teStop(t){
  if(t.timer){clearInterval(t.timer);t.timer=null}
  if(t.over&&!t.paid){t.paid=true;const k=me();if(t.score>S.gs.tet[k])S.gs.tet[k]=t.score;const c=Math.min(15,Math.floor(t.score/200));if(c>0)earn(c,'Tetris score '+t.score,k)}
}
function teTick(){
  const t=S.gm.te;
  if(!t||S.tab!=='tetris'){if(t&&t.timer){clearInterval(t.timer);t.timer=null}return}
  if(t.over||t.paused)return;
  if(!teHit(t,t.p.m,t.p.x,t.p.y+1))t.p.y++;else teLock(t);
  teDraw();
}
function teHtml(t){
  const g=t.b.map(r=>r.slice());
  if(!t.over)t.p.m.forEach((r,j)=>r.forEach((v,i)=>{const y=t.p.y+j;if(v&&y>=0&&y<18)g[y][t.p.x+i]=t.p.k}));
  return g.map(r=>r.map(c=>`<i style="${c?`background:${TCOL[c]};box-shadow:inset 0 0 0 2px #5B3A29`:''}"></i>`).join('')).join('');
}
function teDraw(){
  const t=S.gm.te,b=document.getElementById('tboard');if(!b)return;
  b.innerHTML=teHtml(t);
  const s=document.getElementById('tscore');if(s)s.textContent='Score '+t.score+'  Lines '+t.lines;
  const m=document.getElementById('tmsg');if(m){m.hidden=!t.over;m.textContent=t.over?'Game over. Score '+t.score:''}
  if(t.over)render();
}
function teAct(a){
  const t=S.gm.te;if(!t)return;
  if(a==='tet-new'){teNew();render();return}
  if(a==='tet-pause'){t.paused=!t.paused;render();return}
  if(t.over||t.paused)return;
  const p=t.p;
  if(a==='tet-l'&&!teHit(t,p.m,p.x-1,p.y))p.x--;
  if(a==='tet-r'&&!teHit(t,p.m,p.x+1,p.y))p.x++;
  if(a==='tet-rot'){const m=teRot(p.m);for(const dx of [0,-1,1,-2,2])if(!teHit(t,m,p.x+dx,p.y)){p.m=m;p.x+=dx;break}}
  if(a==='tet-d'){if(!teHit(t,p.m,p.x,p.y+1)){p.y++;t.score++}else teLock(t)}
  if(a==='tet-drop'){while(!teHit(t,p.m,p.x,p.y+1)){p.y++;t.score+=2}teLock(t)}
  teDraw();
}

/* actions for the board games */
function gAct(a,v){
  const m=S.gm,k=me();
  const mine=t=>{if(t.over)return false;if(t.turn!==k){toast('Waiting for '+P[t.turn].name);return false}return true};
  const win=g=>{S.gs[g][k]++;};
  if(a==='mm-new'){mNew();return}
  if(a==='mm-flip'){
    const t=m.mm,i=+v;if(t.over)return;if(t.open.length===2)mmFix(t);
    if(t.turn!==k){toast('Waiting for '+P[t.turn].name);return}
    if(t.own[i]||t.open.includes(i))return;
    t.open.push(i);
    if(t.open.length===2){const[x,y]=t.open;
      if(t.c[x]===t.c[y]){t.own[x]=t.own[y]=k;t.open=[];if(t.own.every(Boolean)){t.over=true;const a2=t.own.filter(z=>z==='a').length;if(a2!==8){const w=a2>8?'a':'b';gsw('mm')[w]++;earn(4,'Memory match win',w)}}}
      else setTimeout(()=>{const u=S.gm.mm;if(u&&u.open.length===2){mmFix(u);render()}},1100)}
    return;
  }
  if(a==='db-new'){dNew();return}
  if(a==='db-edge'){
    const t=m.db,N=4,h=v[0]==='h',i=+v.slice(1),arr=h?t.h:t.v;if(!mine(t)||arr[i])return;arr[i]=k;
    const rw=Math.floor(i/(h?N:N+1)),cl=i%(h?N:N+1),bs=h?[[rw-1,cl],[rw,cl]]:[[rw,cl-1],[rw,cl]];let n=0;
    bs.forEach(([r,c])=>{if(r<0||c<0||r>=N||c>=N||t.bx[r*N+c])return;if(t.h[r*N+c]&&t.h[(r+1)*N+c]&&t.v[r*(N+1)+c]&&t.v[r*(N+1)+c+1]){t.bx[r*N+c]=k;n++}});
    if(t.bx.every(Boolean)){t.over=true;const a2=t.bx.filter(z=>z==='a').length;if(a2!==8){const w=a2>8?'a':'b';gsw('db')[w]++;earn(5,'Dots and boxes win',w)}}
    else if(!n)t.turn=other();
    return;
  }
  if(a==='ttt-new'){tNew();return}
  if(a==='ttt-move'){
    const t=m.ttt,i=+v;if(!mine(t)||t.b[i])return;
    t.b[i]=k;const l=TL.find(L=>L.every(j=>t.b[j]===k));
    if(l){t.win=l;t.over=true;win('ttt');earn(3,'Tic-tac-toe win')}else if(t.b.every(c=>c))t.over=true;else t.turn=other();
    return;
  }
  if(a==='c4-new'){cNew();return}
  if(a==='c4-drop'){
    const t=m.c4,x=+v;if(!mine(t))return;
    let r=5;while(r>=0&&t.b[r*7+x])r--;if(r<0){toast('That column is full');return}
    const i=r*7+x;t.b[i]=k;const l=c4win(t.b,i);
    if(l){t.win=l;t.over=true;win('c4');earn(4,'Connect 4 win')}else if(t.b.every(c=>c))t.over=true;else t.turn=other();
    return;
  }
  if(a==='pz-new'){pNew(+v);return}
  if(a==='pz-move'){
    const z=m.pz,n=z.n,i=+v;if(z.done)return;
    const e=z.t.indexOf(n*n-1),r=(i/n)|0,c=i%n,er=(e/n)|0,ec=e%n;
    if(Math.abs(r-er)+Math.abs(c-ec)!==1)return;
    [z.t[i],z.t[e]]=[z.t[e],z.t[i]];z.moves++;
    if(z.t.every((x,j)=>x===j)){z.done=true;if(!z.paid){z.paid=true;earn(8,'Puzzle solved')}}
    return;
  }
  if(a==='uno-new'){uNew();return}
  const u=m.uno;
  if(a==='uno-color'){u.color=v;u.pick=false;uAfter(u,u.disc[u.disc.length-1]);return}
  if(a==='uno-play'){
    if(u.over||u.pick)return;if(u.turn!==k){toast('Waiting for '+P[u.turn].name);return}
    const c=u.hands[k][+v];if(!c)return;if(!uOk(u,c)){toast('That card does not match');return}
    u.hands[k].splice(+v,1);u.disc.push(c);
    if(c==='W'||c==='F'){if(!u.hands[k].length){uEnd(u);return}u.pick=true;return}
    u.color=c[0];uAfter(u,c);return;
  }
  if(a==='uno-draw'){
    if(u.over||u.pick)return;if(u.turn!==k){toast('Waiting for '+P[u.turn].name);return}
    uDraw(u,k,1);u.turn=other();u.msg=P[k].name+' drew a card.';return;
  }
}
